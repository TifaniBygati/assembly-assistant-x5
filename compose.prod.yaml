services:

  postgres:

    image: postgres:18
    restart: unless-stopped

    ports:
      - "127.0.0.1:5433:5432"

    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  assembly-assistant-x5:
    image: ghcr.io/tifanibygati/assembly-assistant-x5:latest
    restart: unless-stopped

    ports:
      - "127.0.0.1:8001:8000"

    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${DB_NAME}

    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
    external: true
    name: postgres_data
