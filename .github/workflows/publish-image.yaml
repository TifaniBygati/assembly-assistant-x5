name: Publish app image

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish_image:
    runs-on: ubuntu-24.04

    steps:

      - name: init_checkout_repo
        uses: actions/checkout@v7

      - name: login_ghcr
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: setup_buildx
        uses: docker/setup-buildx-action@v4

      - name: build_and_push_image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: prod
          push: true
          tags: |
            ghcr.io/tifanibygati/assembly-assistant-x5:latest
            ghcr.io/tifanibygati/assembly-assistant-x5:${{ github.sha }}

